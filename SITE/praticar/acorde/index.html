<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acorde Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <section>
            <a href="#" class="logo_nav">
                <img src="../../img/logo.png" id="logo-navbar">
            </a>
            <div class="navbar">
                <a href="#">Home</a>
                <a href="about">Sobre</a>
                <a href="#practice">Praticar</a>
                <a href="#profile">Perfil</a>
            </div>
            <div class="auth-buttons">
                <a href="#login" class="btn-login">Login</a>
                <a href="#cadastro" class="btn-cadastro">Cadastro</a>
            </div>
        </section>
    </header>
    <h4><i class="material-icons">equalizer</i>Acorde</h4>
    <main>
    <div id="player">
        <div class="card">
            <div class="card-image"></div>
            <a href="#" class="btn-floating btn-large halfway-fab">
                <i class="material-icons" id="play-pause">play_arrow</i>
            </a>
            <div class="card-content">
                <h5>Title</h5> 
            </div>
        </div>
    </div>
    <div class="app">
        <div class="quiz">
            <h2 id="question">Tipo do acorde</h2>
            <div id="answer-buttons">
                <button class="op-btn">Maior</button>
                <button class="op-btn">Menor</button>
            </div>
            <button id="next-btn">Next</button>
        </div>
    </div>
</main>
</body>
</html>
<script type = "module" src="index.js"></script>
