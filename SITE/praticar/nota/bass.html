<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixo(Notas)</title>
    <link rel="stylesheet" href="./style.css">

</head>
<body>

    <button onclick="voltar()"><<<</button> <br>

    <button onclick="play()">Play</button> <br><br>
    <button onclick="btn_C()">C</button>
    <button onclick="btn_D()">D</button>
    <button onclick="btn_E()">E</button>
    <button onclick="btn_F()">F</button>
    <button onclick="btn_G()">G</button>
    <button onclick="btn_A()">A</button>
    <button onclick="btn_B()">B</button> <br><br>

    <button onclick="btn_verificar()">Verificar</button> 
    <button onclick="btn_next()">></button>

    <audio id="nota_C">
        <source src="./files/bass/Nota_C.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_D">
        <source src="./files/bass/Nota_D.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_E">
        <source src="./files/bass/Nota_E.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_F">
        <source src="./files/bass/Nota_F.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_G">
        <source src="./files/bass/Nota_G.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_A">
        <source src="./files/bass/Nota_A.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_B">
        <source src="./files/bass/Nota_B.mp3" type="audio/mpeg">
    </audio>

    <div id="div_mensagem"></div>


    

</body>
</html>
<script>
    var notas = [
        document.getElementById("nota_C"),
        document.getElementById("nota_D"),
        document.getElementById("nota_E"),
        document.getElementById("nota_F"),
        document.getElementById("nota_G"),
        document.getElementById("nota_A"),
        document.getElementById("nota_B")
    ];

    var btn_selecionado = 0;
    var aleatorio = Math.floor(Math.random() * 7);
    var nota = 0;


    function play() {
        nota = aleatorio;  
        notas[nota].play();
}

    function btn_C() {
        btn_selecionado = 0;
        notas[btn_selecionado].play()
    }

    function btn_D() {
        btn_selecionado = 1;
        notas[btn_selecionado].play()
    }

    function btn_E() {
        btn_selecionado = 2;
        notas[btn_selecionado].play()
    }

    function btn_F() {
        btn_selecionado = 3;
        notas[btn_selecionado].play()
    }

    function btn_G() {
        btn_selecionado = 4;
        notas[btn_selecionado].play()
    }

    function btn_A() {
        btn_selecionado = 5;
        notas[btn_selecionado].play()
    }

    function btn_B() {
        btn_selecionado = 6;
        notas[btn_selecionado].play()
    }

    function btn_verificar() {
        if(nota != btn_selecionado) {
            div_mensagem.innerHTML = 'nota errada';
        } else {
            div_mensagem.innerHTML = 'nota certa';
        }
    }

    function btn_next() {
        aleatorio = Math.floor(Math.random() * 7);
        div_mensagem.innerHTML = "";
    }

    function voltar() {
        document.body.innerHTML = `
        <div>
            <a href="../home/index.html">
            <button><<<</button>
            </a>
        </div> <br>

        <div id="option_nota">
            <a href="../nota/bass.html">
            <button class="btn_exercicio">Nota</button>
            </a>
        </div>

        <div id="option_acorde">
            <a href="../acorde/bass.html">
            <button class="btn_exercicio">Acorde</button>
            </a>
        </div>
        `
    }

</script>
