<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sonare Cadastro</title>
</head>
<body>
    <main class="container">
        <form>
            <h1><img src="../img/logo.png" id="icon-logo">Cadastro</h1>
            <div class="input-box">
                <input placeholder="E-mail" type="email">
            </div>

            <div class="input-box">
                <input placeholder="Nome" type="name">
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password">
            </div>
            <div class="input-box">
                <input placeholder="Confirme" type="password">
            </div>
                <!-- <a href="#">Esqueci minha senha</a> -->
            </div>
            <button type="submit" class="cadastro">Cadastrar</button>
        </form>
    </main>
</body>
</html>
