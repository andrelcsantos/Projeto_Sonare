<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teclado opções</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="config_container">
        <h2 class="config_titulo">Tipo de exercício</h2>

        <div class="config_option">
                <button id="btn_notas" class="category_option active" onclick="selectCategoria('Notas')">Notas</button>
                <button id="btn_acordes" class="category_option" onclick="selectCategoria('Acordes')">Acordes</button>
        </div>
    

    <div class="config_option">
        <h4 class="config_option">Número de questões</h4>
        <div class="questions_option">
            <button id="btn_5" class="questions_option active" onclick="selectQt(5)">5</button>
            <button id="btn_10" class="questions_option" onclick="selectQt(10)">10</button>
            <button id="btn_15" class="questions_option">15</button>
        </div>
    </div>
    <button class="iniciar-exercicio"onclick="praticar()">Praticar</button>
</div>


<div id="div_mensagem"></div>
</body>
</html>
<script>
    var categoria = 'Notas';
    var qtQuestoes = 5;

    function selectCategoria(tipo) {
        categoria = tipo;

        div_mensagem.innerHTML = categoria;
    }

    function selectQt(qt) {
        qtQuestoes = qt;
        div_mensagem.innerHTML += `<br> ${qtQuestoes}`;
    }

    function praticar() {
        localStorage.setItem("categoria", categoria);
        localStorage.setItem("questoes", qtQuestoes);

        if(categoria == 'Notas') {
            window.location.href = "notasTeclado.html";
        } else {
            window.location.href = "acordesTeclado.html";
        }
    }

</script>
