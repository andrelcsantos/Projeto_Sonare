<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violão(Acordes)</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <button onclick="play()">Play</button> <br><br>
    <button onclick="btn_Maior()">Maior</button>
    <button onclick="btn_Menor()">Menor</button>

    <button onclick="btn_next()">></button>

    <audio id="C_Maior">
        <source src="../files/violao/acordes/C_Maior.mp3" type="audio/mpeg">
    </audio>
    <audio id="D_Maior">
        <source src="../files/violao/acordes/D_Maior.mp3" type="audio/mpeg">
    </audio>
    <audio id="E_Maior">
        <source src="../files/violao/acordes/E_Maior.mp3" type="audio/mpeg">
    </audio>
    <audio id="F_Maior">
        <source src="../files/violao/acordes/F_Maior.mp3" type="audio/mpeg">
    </audio>
    <audio id="G_Maior">
        <source src="../files/violao/acordes/G_Maior.mp3" type="audio/mpeg">
    </audio>
    <audio id="A_Maior">
        <source src="../files/violao/acordes/A_Maior.mp3" type="audio/mpeg">
    </audio>
    <audio id="B_Maior">
        <source src="../files/violao/acordes/B_Maior.mp3" type="audio/mpeg">
    </audio>
    
    
    <audio id="C_Menor">
        <source src="../files/violao/acordes/C_Menor.mp3" type="audio/mpeg">
    </audio>
    <audio id="D_Menor">
        <source src="../files/violao/acordes/D_Menor.mp3" type="audio/mpeg">
    </audio>
    <audio id="E_Menor">
        <source src="../files/violao/acordes/E_Menor.mp3" type="audio/mpeg">
    </audio>
    <audio id="F_Menor">
        <source src="../files/violao/acordes/F_Menor.mp3" type="audio/mpeg">
    </audio>
    <audio id="G_Menor">
        <source src="../files/violao/acordes/G_Menor.mp3" type="audio/mpeg">
    </audio>
    <audio id="A_Menor">
        <source src="../files/violao/acordes/A_Menor.mp3" type="audio/mpeg">
    </audio>
    <audio id="B_Menor">
        <source src="../files/violao/acordes/B_Menor.mp3" type="audio/mpeg">
    </audio>
    


    <div id="div_mensagem"></div>
    

</body>
</html>
<script>
    var fk_usuario = 1;
    var fk_instrumento = 2;
    var categoria = localStorage.getItem("categoria");
    var qtQuestoes = Number(localStorage.getItem("questoes"));
    var questaoAtual = 1;
    var acorde = Math.floor(Math.random() * 7);
    var tipo = Math.floor(Math.random() * 2);

    var acordes = [
        [
        document.getElementById("C_Maior"),
        document.getElementById("D_Maior"),
        document.getElementById("E_Maior"),
        document.getElementById("F_Maior"),
        document.getElementById("G_Maior"),
        document.getElementById("A_Maior"),
        document.getElementById("B_Maior")
        ],

        [        
        document.getElementById("C_Menor"),
        document.getElementById("D_Menor"),
        document.getElementById("E_Menor"),
        document.getElementById("F_Menor"),
        document.getElementById("G_Menor"),
        document.getElementById("A_Menor"),
        document.getElementById("B_Menor")
    ]
    ];



    function play() {
  
        acordes[tipo][acorde].play();
}

    function btn_Maior() {

        if (0 == tipo) {
            div_mensagem.innerHTML = 'Resposta certa'
         } else {
            div_mensagem.innerHTML = 'Resposta errada'
         }
    }

    function btn_Menor() {

         if (1 == tipo) {
            div_mensagem.innerHTML = 'Resposta certa'
         } else {
            div_mensagem.innerHTML = 'Resposta errada'
         }
    }

    function btn_next() {
        acorde = Math.floor(Math.random() * 7);
        tipo = Math.floor(Math.random() * 2);
        div_mensagem.innerHTML = `Ex atual: ${questaoAtual} / Última questão: ${qtQuestoes}`;
        questaoAtual++;
        

        if(questaoAtual > qtQuestoes) {
            div_mensagem.innerHTML = 'Exercício concluido'
            salvar();
        }
    }

    function salvar() {
        console.log(fk_usuario, fk_instrumento, categoria)

        fetch("/exercicios/salvar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                fk_usuarioServer: fk_usuario,
                fk_instrumentoServer: fk_instrumento,
                tipo_exercicioServer: categoria
            }),
        }).then(function(resposta){
            if(resposta.ok){
                console.log("Dados salvos")
            } else{
                console.log("Erro ao salvar dados")
            }
        })
        .catch(function(erro){
            console.error("Erro: ", erro)
        })


    }


</script>
