<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violão(Notas)</title>
    <link rel="shortcut icon" href="../../img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="exercicio-container">
        <div class="exercicio-conteudo">
            <header class="exercicio-header">
                <h2 class="config-title">Violão</h2>

            </header>
            <div class="config-option">
                <div class="exercicio-options">
                    <button onclick="play()">Play</button> <br><br>

                        <div id="grupo-ins">
                            <button id="btnC" onclick="btn_C()">C</button>
                            <button id="btnD" onclick="btn_D()">D</button>
                            <button id="btnE" onclick="btn_E()">E</button>
                            <button id="btnF" onclick="btn_F()">F</button>
                            <button id="btnG" onclick="btn_G()">G</button>
                            <button id="btnA" onclick="btn_A()">A</button>
                            <button id="btnB" onclick="btn_B()">B</button>
                        </div>
                    </div>
                </div>
                
                <div class="exercicio-footer">
                    <button class="verificar-question-btn" onclick="btn_verificar()">Verificar</button>
                    <div id="div_mensagem"></div>
                    <button class="next-question-btn" onclick="btn_next()">Próximo</button>
                </div>
            </div>
        </div>


    <audio id="nota_C">
        <source src="../files/violao/notas/Nota_C.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_D">
        <source src="../files/violao/notas/Nota_D.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_E">
        <source src="../files/violao/notas/Nota_E.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_F">
        <source src="../files/violao/notas/Nota_F.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_G">
        <source src="../files/violao/notas/Nota_G.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_A">
        <source src="../files/violao/notas/Nota_A.mp3" type="audio/mpeg">
    </audio>
    <audio id="nota_B">
        <source src="../files/violao/notas/Nota_B.mp3" type="audio/mpeg">
    </audio>

    
    

</body>
</html>
<script>
    var notas = [
        document.getElementById("nota_C"),
        document.getElementById("nota_D"),
        document.getElementById("nota_E"),
        document.getElementById("nota_F"),
        document.getElementById("nota_G"),
        document.getElementById("nota_A"),
        document.getElementById("nota_B")
    ];

    var btn_selecionado = -1;
    var aleatorio = Math.floor(Math.random() * 7);
    var categoria = localStorage.getItem("categoria");
    var qtQuestoes = Number(localStorage.getItem("questoes"));
    var questaoAtual = 1;
    var nota = 0;
    var acertos = 0;
    var erros = 0;
    var fk_instrumento = 2;
    var fk_usuario = 1;
    var verificado = false;
    div_mensagem.innerHTML = `${questaoAtual} de ${qtQuestoes} Questões`;


    function play() {
        nota = aleatorio;  
        notas[nota].play();
}

    function btn_C() {
        btn_selecionado = 0;
        notas[btn_selecionado].play()
    }

    function btn_D() {
        btn_selecionado = 1;
        notas[btn_selecionado].play()
    }

    function btn_E() {
        btn_selecionado = 2;
        notas[btn_selecionado].play()
    }

    function btn_F() {
        btn_selecionado = 3;
        notas[btn_selecionado].play()
    }

    function btn_G() {
        btn_selecionado = 4;
        notas[btn_selecionado].play()
    }

    function btn_A() {
        btn_selecionado = 5;
        notas[btn_selecionado].play()
    }

    function btn_B() {
        btn_selecionado = 6;
        notas[btn_selecionado].play()
    }

    function btn_verificar() {

        if(btn_selecionado != -1){
            verificado = true;
            if(nota != btn_selecionado) {
            erros++;
            if(nota == 0) {
                btnC.style.backgroundColor = "#4CAF50"
            } else if(nota == 1) {
                btnD.style.backgroundColor = "#4CAF50"
            } else if(nota == 2) {
                btnE.style.backgroundColor = "#4CAF50"
            } else if(nota == 3) {
                btnF.style.backgroundColor = "#4CAF50"
            } else if(nota == 4) {
                btnG.style.backgroundColor = "#4CAF50"
            } else if(nota == 5) {
                btnA.style.backgroundColor = "#4CAF50"
            } else {
                btnB.style.backgroundColor = "#4CAF50"
            }

        } else {
            acertos++;
            if(btn_selecionado == 0) {
                btnC.style.backgroundColor = "#4CAF50"
            } else if(btn_selecionado == 1) {
                btnD.style.backgroundColor = "#4CAF50"
            } else if(btn_selecionado == 2) {
                btnE.style.backgroundColor = "#4CAF50"
            } else if(btn_selecionado == 3) {
                btnF.style.backgroundColor = "#4CAF50"
            } else if(btn_selecionado == 4) {
                btnG.style.backgroundColor = "#4CAF50"
            } else if(btn_selecionado == 5) {
                btnA.style.backgroundColor = "#4CAF50"
            } else {
                btnB.style.backgroundColor = "#4CAF50"
            }
        }
        }
        
    }

    function btn_next() {
        if(btn_selecionado != -1 && verificado == true) {
        aleatorio = Math.floor(Math.random() * 7);
        questaoAtual++;
        div_mensagem.innerHTML = `${questaoAtual} de ${qtQuestoes} Questões`;
        btnC.style.backgroundColor = "#FFF";
        btnD.style.backgroundColor = "#FFF";
        btnE.style.backgroundColor = "#FFF";
        btnF.style.backgroundColor = "#FFF";
        btnG.style.backgroundColor = "#FFF";
        btnA.style.backgroundColor = "#FFF";
        btnB.style.backgroundColor = "#FFF";
        if(questaoAtual > qtQuestoes) {
            alert(`Você acerto: ${acertos} e errou ${erros} de ${qtQuestoes} questões`)
            window.location.href = "../../dashboard/index.html";
            salvar();
        }
        btn_selecionado = -1;
        verificado = false;
        }
        
    }

    function salvar() {
        console.log(fk_usuario, fk_instrumento, categoria, acertos, erros)

        fetch("/exercicios/salvar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                fk_usuarioServer: fk_usuario,
                fk_instrumentoServer: fk_instrumento,
                tipo_exercicioServer: categoria,
                respostas_certasServer: acertos,
                respostas_erradasServer: erros
            }),
        }).then(function(resposta){
            if(resposta.ok){
                console.log("Dados salvos")
            } else{
                console.log("Erro ao salvar dados")
            }
        })
        .catch(function(erro){
            console.error("Erro: ", erro)
        })
    
    }


</script>
