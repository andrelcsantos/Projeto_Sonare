<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="../site/img/logo.png" type="image/x-icon">
    <title>Sonare Login</title>

    <script src="../../js/sessao.js"></script>
</head>
<body>
    <main class="container">
            <h1><img src="../img/logo.png" id="icon-logo">Login Sonare</h1>
            <div class="input-box">
                <input placeholder="E-mail" type="email" id="input_email">
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password" id="input_senha">
                <i class="bx bxs-lock-alt"></i>
            </div>
            <button type="submit" class="login" onclick="login()">Login</button>

            <div class="registro-link">
                <p>Não tem uma conta? <a href="../cadastro/index.html">Cadastre-se</a></p>
            </div>


    </main>
</body>
</html>
<script>

    function login() {
        // aguardar();
        var email = input_email.value;
        var senha = input_senha.value;

        if (email == "" || senha == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000)
        }

        if(!email.includes('@') || !email.includes('.com') || email == '' || senha == '') {
            if (!email.includes('@') || !email.includes('.com')) {
                alert('Por favor, coloque um e-mail válido.')
            } else {
                alert('Por favor, preencha todos os campos')
            }
        } else {
            fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO login()!")

            if (resposta.ok) {
              alert('Login')
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id_usuario
                    setTimeout(function () {
                        window.location = "../dashboard/index.html";
                    }, 1000); 

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })
    }
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }
</script>
