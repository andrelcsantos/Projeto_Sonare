<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonare | Dashboard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="janela">
        <div class="header-left">
            <h1>Sonare</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./index.html">
                    <h3>Exercícios</h3>
                </a>
            </div>

            <div class="btn-nav">
                <a href="./dashboard.html">
                    <h3>Perfil</h3>
                </a>
            </div>


            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash">
            <div id="alerta">
            </div>

            <div class="btns-dash" id="btnAquario">
                <!-- O gráfico é chamado de acordo com o id (fk_aquario) do banco  -->
            </div>
            <div id="graficos">
            </div>
        </div>
    </div>

    
    <div class="config-container">
        <h2 class="config-title">Escolha um instrumento </h2>

        <div class="config-option">
            <div class="instrumentos-options">
                <button class="instrumento-options" onclick="selectInstrumento(1)">Baixo</button>
                <button class="instrumento-options" onclick="selectInstrumento(2)">Violão</button>
                <button class="instrumento-options" onclick="selectInstrumento(3)">Teclado</button>
            </div>
        </div>

        <div class="config-option">
            <h4 class="option-title">Tipo de exercício</h4>
            <div class="exercicio-options">
                <button class="exercicio-option" onclick="selectCategoria('Acordes')">Acordes</button>
                <button class="exercicio-option" onclick="selectCategoria('Notas')">Notas</button>
            </div>
        </div>

        <div class="config-option">
            <h4 class="option-title">Quantidade de questões</h4>
            <div class="exercicio-options">
                <button class="exercicio-option" onclick="selectQt(5)">5</button>
                <button class="exercicio-option" onclick="selectQt(10)">10</button>
                <button class="exercicio-option" onclick="selectQt(15)">15</button>
            </div>
        </div>

        <button class="praticar-btn" onclick="praticar()">Praticar</button>
    </div>
</body>
</html>

<script>
    var fkUsuario = sessionStorage.ID_USUARIO;
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    var fkInstrumento = 3;
    var categoria = 'Acordes';
    var qtQuestoes = 5;

    function selectInstrumento(tipo_ins){
        instrumento = tipo_ins;
    }

    function selectCategoria(tipo_exe){
        categoria = tipo_exe;
    }

    function selectQt(qt) {
        qtQuestoes = qt;
    }

    function praticar() {
        localStorage.setItem("categoria", categoria);
        localStorage.setItem("questoes", qtQuestoes);

        if(instrumento == 1) {
            if(categoria == 'Notas') {
            window.location.href = "../praticar/bass/notasBass.html";
        } else {
            window.location.href = "../praticar/bass/acordesBass.html";
        }
    }
        
        if(instrumento == 2){
            if(categoria == 'Notas') {
            window.location.href = "../praticar/violao/notasViolao.html";
        } else {
            window.location.href = "../praticar/violao/acordesViolao.html";
        }
    }

        if(instrumento == 3){
            if(categoria == 'Notas') {
            window.location.href = "../praticar/teclado/notasTeclado.html";
        } else {
            window.location.href = "../praticar/teclado/acordesTeclado.html";
        }
    }
}


    fetch(`/exercicios/diasConsecutivos/${fkUsuario}`)
    .then(res => res.json())
    .then(dados => {
        const div = document.getElementById("diasConsecutivos_kpi");
        if(dados && dados.dias_consecutivos != undefined) {
            const dias = dados.dias_consecutivos;
            div.innerHTML = `Dias consecutivos: ${dias}`;
        } else {
            div.innerHTML = 0;
        }
    })
    .catch(err => {
        console.error("Erro ao exibir dias", err);
    });
    


    fetch(`/exercicios/acertos/${fkInstrumento}`)
    .then(res => res.json())
    .then(dados => {
        const div = document.getElementById("acertos_kpi");
        if(dados && dados.total_acertos != undefined) {
            const acertos = dados.total_acertos;
            div.innerHTML = `Acertos: ${acertos}`;
        } else {
            div.innerHTML = 0;
        }
    })




    fetch(`/exercicios/erros/${fkInstrumento}`)
    .then(res => res.json())
    .then(dados => {
        const div = document.getElementById("erros_kpi");
        if(dados && dados.total_erros != undefined) {
            const erros = dados.total_erros;
            div.innerHTML = `Erros: ${erros}`;
        } else {
            div.innerHTML = 0;
        }
    })
   

</script>
